:root {

}

* { box-sizing: border-box; }
html { min-width: 320px; }

svg { width: 20px; height: 20px; flex-shrink: 0; }

.app-shell { min-height: 100vh; }

.hero { min-height: 254px; position: relative; display: flex; flex-direction: column; justify-content: center; padding: 37px 280px 37px 0; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 17px; margin: 0 0 40px; }

input::placeholder, textarea::placeholder { color: #b0a598; opacity: 1; }
.sort-select { appearance: none; min-width: 115px; height: 39px; padding: 8px 28px 8px 11px; border: 1px solid var(--line); border-radius: 6px; font-size: 11px; color: #8b7c6b; background-color: #fcfaf5; background-image: url("data:image/svg+xml,%3Csvg width='12' height='12' viewBox='0 0 12 12' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='m3 4.5 3 3 3-3' fill='none' stroke='%23968a7a' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 10px center; }
.filter-tabs { display: flex; gap: 5px; border-bottom: 1px solid var(--line); margin-bottom: 19px; }
.filter-tab { border: 0; border-bottom: 2px solid transparent; background: transparent; color: #9b8f80; font-size: 11px; padding: 8px 13px 12px; margin-bottom: -1px; transition: color .18s, border-color .18s; }
.filter-tab:hover { color: #796652; }

.record-title { margin: 10px 0 7px; font-family: var(--serif); font-size: 16px; line-height: 1.7; font-weight: 600; letter-spacing: .3px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.modal-head, .detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 23px; }
.modal-head h2 { font-size: 22px; }
.modal-close { flex-shrink: 0; margin: -3px -7px 0 0; }
.field { margin-bottom: 18px; }
.field > label { display: block; font-size: 12px; color: #6c5b4c; margin-bottom: 7px; font-weight: 500; }
.field label span, .field label small { color: #aaa08e; font-weight: 400; font-size: 10px; margin-left: 5px; }

<noscript><p style="padding:20px">此记录本需要浏览器执行 JavaScript。请用真正的浏览器打开 HTML 文件，部分手机文件预览不支持。</p></noscript>
<div class="app-shell simple-app">

  <main class="main">
    <header class="simple-heading"><div><h1>问答记录</h1><p>问题、结果和每次解答，放在一起记录。</p></div><button class="primary" data-action="new"><span data-icon="plus"></span>新增问答</button></header>

      <div class="records-pane">
        <div class="section-heading"><div class="heading-copy"><h2 id="list-title">全部问答 <span id="list-count">00</span></h2></div></div>
        <div class="toolbar"><label class="search-wrap"><span data-icon="search"></span><input id="search" class="search" type="search" placeholder="搜索问题、组名或解答…" aria-label="搜索问题、组名、结果或解答"></label><select class="sort-select" id="sort" aria-label="排序方式"><option value="updated">最近更新</option><option value="created">最新记录</option><option value="oldest">最早记录</option></select></div>

</div>
<dialog id="record-modal" class="modal" aria-labelledby="record-modal-title"><div class="modal-head"><div><h2 id="record-modal-title">新增问答</h2></div><button type="button" class="icon-btn modal-close" aria-label="关闭" data-close="record-modal" data-icon="x"></button></div><form id="record-form"><input type="hidden" name="id"><div class="field"><label for="question">问题 <em>*</em></label><input id="question" name="question" maxlength="160" required placeholder="给这个问题起一个清晰的标题"></div><div class="field"><label for="record-group">所属问答组 <span>选填，同一次问的多个问题用相同组名</span></label><input id="record-group" name="group" maxlength="80" list="group-names" placeholder="输入新组名，或选择已有分组" autocomplete="off"><p class="form-hint">例如：10月28日的问答。留空则单独保存。</p></div><div class="field"><label for="background">补充背景 <span>选填</span></label><textarea id="background" name="background" rows="2" maxlength="10000" placeholder="当时的情境、相关信息…"></textarea></div><div class="field"><label for="result">问答结果 <span>选填，之后也可以补充</span></label><textarea id="result" name="result" rows="3" maxlength="20000" placeholder="记录这次问答得到的结果"></textarea></div><div class="field" id="first-answer-field"><label for="first-answer">我的第一次解答 <span>选填</span></label><textarea id="first-answer" name="firstAnswer" rows="3" maxlength="20000" placeholder="写下你的解答…"></textarea></div><div class="field"><label for="tags">标签 <span>选填，用逗号分隔，最多 8 个</span></label><input id="tags" name="tags" maxlength="220" placeholder="例如：待复盘，灵感"></div><div class="modal-actions"><span class="form-hint">保存后可随时修改、追加解答</span><button type="button" class="secondary" data-close="record-modal">取消</button><button type="submit" class="primary">保存记录</button><button type="submit" class="secondary" id="save-and-next" data-continue="true">保存并再记一题</button></div></form></dialog>
<dialog id="detail-modal" class="modal detail-modal" aria-labelledby="detail-heading"><div id="detail-content"></div></dialog>
<dialog id="answer-modal" class="modal" aria-labelledby="answer-modal-title"><div class="modal-head"><div><h2 id="answer-modal-title">追加一次解答</h2></div><button type="button" class="icon-btn" data-close="answer-modal" aria-label="关闭" data-icon="x"></button></div><form id="answer-form"><input type="hidden" name="recordId"><input type="hidden" name="answerId"><p class="form-hint" id="answer-question"></p><div class="field"><label for="answer-date">解答日期</label><input type="date" name="date" id="answer-date" min="0001-01-01" max="9999-12-31" required></div><div class="field"><label for="answer-body">解答内容 <em>*</em></label><textarea id="answer-body" name="body" rows="7" required maxlength="20000" placeholder="新的理解、补充或回头看时的发现…"></textarea></div><div class="modal-actions"><span class="form-hint">每次解答会独立保留</span><button type="button" class="secondary" data-close="answer-modal">取消</button><button type="submit" class="primary">保存解答</button></div></form></dialog>

<script>
(()=>{
'use strict';
const STORAGE_KEY = 'daozhuang-notebook-v1';
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const uid = () => {
  if (typeof globalThis.crypto?.randomUUID === 'function') return globalThis.crypto.randomUUID();
  const bytes = new Uint8Array(16);
  if (globalThis.crypto?.getRandomValues) globalThis.crypto.getRandomValues(bytes);
  else for (let i=0;i<bytes.length;i++) bytes[i]=Math.floor(Math.random()*256);
  bytes[6]=(bytes[6]&15)|64; bytes[8]=(bytes[8]&63)|128;
  const h=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
};
const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parseTags = value => [...new Set(value.split(/[,，、]/).map(s=>s.trim()).filter(Boolean))].slice(0,8).map(s=>s.slice(0,24));
function selectRecords(records, {view='all', filter='all', search='', sort='updated'} = {}) {
  const q=search.toLocaleLowerCase().trim();
  return records.filter(r => (view !== 'pending' || !r.result.trim()) && (view !== 'answered' || r.answers.length) && (view !== 'starred' || r.starred) && (filter !== 'pending' || !r.result.trim()) && (filter !== 'done' || r.result.trim()) && (!q || [r.question,r.background,r.result,r.group||'',...r.tags,...r.answers.map(a=>a.body)].join('\n').toLocaleLowerCase().includes(q))).sort((a,b)=>sort==='oldest'? a.createdAt.localeCompare(b.createdAt) : sort==='created'?b.createdAt.localeCompare(a.createdAt):b.updatedAt.localeCompare(a.updatedAt));
}
function validateRecords(input) {
  if(!Array.isArray(input) || input.length > 10000) throw Error('记录格式不正确，或超过 10,000 条。');
  const ids=new Set();
  const isText=(s,max)=>typeof s==='string' && s.length<=max;

function parseBackup(text) {

  if(data?.app!=='daozhuang-notebook' || ![1,2].includes(data.version)) throw Error('这不是本站支持的备份文件，请选择“导出备份”生成的 JSON 文件。');

}

function groupRecords(records) {
  const groups=new Map();
  for(const record of records) {
    const name=record.group||'';
    if(!groups.has(name)) groups.set(name,{name,records:[]});
    groups.get(name).records.push(record);
  }
  return [...groups.values()];
}

function assignGroup(records, ids, name, stamp=new Date().toISOString()) {
  if(typeof name!=='string' || name.trim().length>80) throw Error('问答分组名称格式不正确，最多 80 个字符。');
  const group=name.trim(), selected=new Set(ids);
  return records.map(record=>selected.has(record.id)?{...record,group,updatedAt:stamp}:record);
}

function renameGroup(records, oldName, newName, stamp=new Date().toISOString()) {
  if(typeof oldName!=='string' || !oldName.trim() || oldName.trim().length>80 || !records.some(record=>record.group===oldName)) throw Error('找不到要重命名的分组。');
  if(typeof newName!=='string' || !newName.trim() || newName.trim().length>80) throw Error('请输入 1 到 80 个字符的分组名称。');
  const group=newName.trim();
  if(group===oldName) return records;
  if(records.some(record=>record.group===group)) throw Error('此分组名称已存在，请换一个名称');
  return records.map(record=>record.group===oldName?{...record,group,updatedAt:stamp}:record);
}

function formatTimestamp(value) {
  if((typeof value!=='string' && typeof value!=='number' && !(value instanceof Date)) || value==='') return '时间未知';
  const date=new Date(value);
  if(!Number.isFinite(date.getTime())) return '时间未知';
  const pad=number=>String(number).padStart(2,'0');
  return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
}

  if(button.dataset.readGroup){if($('#detail-modal').open)close('#detail-modal');showGroupReader(button.dataset.readGroup);return}
  if(button.dataset.newInGroup){if($('#group-reader').open)close('#group-reader');if($('#detail-modal').open)close('#detail-modal');newRecord(button.dataset.newInGroup);return}
  if(button.dataset.open){if($('#group-reader').open)close('#group-reader');showDetail(button.dataset.open);return}
  if(button.dataset.editAnswer){answerForm(button.dataset.editAnswer);return}
  if(button.dataset.deleteAnswer){const r=records.find(r=>r.id===activeId),a=r?.answers.find(a=>a.id===button.dataset.deleteAnswer);if(!a)return;confirm('删除这次解答？',`${a.date} 的解答将被删除，其他解答会保留。此操作无法撤销。`,()=>{if(updateRecord(r.id,{answers:r.answers.filter(x=>x.id!==a.id)})){showDetail(r.id,false);notify('已删除这次解答')}},true,'删除解答');return}
  switch(button.dataset.action){case 'new':newRecord();break;case 'reset':view='all';filter='all';$('#search').value='';render();break;case 'edit':editRecord(activeId);break;case 'answer':answerForm();break;case 'star':{const r=records.find(r=>r.id===activeId);if(r&&updateRecord(r.id,{starred:!r.starred})){showDetail(r.id,false);notify(r.starred?'已取消收藏':'已收藏这条问答')}break}case 'delete':{const r=records.find(r=>r.id===activeId);if(r)confirm('删除这条问答？',`“${r.question}”及其 ${r.answers.length} 次解答将一并删除，此操作无法撤销。`,()=>{if(persist(records.filter(x=>x.id!==r.id))){close('#detail-modal');activeId=null;notify('已删除问答')}},true,'删除问答');break}}
});
$('#record-form').addEventListener('submit',ev=>{ev.preventDefault();const f=ev.currentTarget,q=f.elements.question.value.trim();if(!q){f.elements.question.setCustomValidity('请写下问题，不能只有空格。');f.elements.question.reportValidity();return}const stamp=new Date().toISOString(),id=f.elements.id.value;const group=f.elements.group.value.trim();if(ev.submitter?.dataset.continue==='true'&&!group){f.elements.group.setCustomValidity('先填一个问答组名称，就能连续记录同组的问题。');f.elements.group.reportValidity();return}const change={question:q,group,background:f.elements.background.value.trim(),result:f.elements.result.value.trim(),tags:parseTags(f.elements.tags.value)};let saved;
  if(id){saved=updateRecord(id,change)}else{const first=f.elements.firstAnswer.value.trim();const record={...change,id:uid(),starred:false,createdAt:stamp,updatedAt:stamp,answers:first?[{id:uid(),body:first,date:today(),createdAt:stamp,updatedAt:stamp}]:[]};saved=persist([record,...records]);if(saved){selectionMode=false;selectedIds.clear();view='all';filter='all';$('#search').value='';render()}}
  if(saved){if(ev.submitter?.dataset.continue==='true'){f.reset();f.elements.group.value=group;f.elements.question.focus();notify('已保存，继续记录同组的下一题')}else{close('#record-modal');if(id&&$('#detail-modal').open)showDetail(id,false);notify(id?'修改已保存':'问答已保存')}}
});
$('#record-group').addEventListener('input',ev=>ev.target.setCustomValidity(''));
$('#question').addEventListener('input',ev=>ev.target.setCustomValidity(''));
$('#answer-form').addEventListener('submit',ev=>{ev.preventDefault();const f=ev.currentTarget,body=f.elements.body.value.trim();if(!body){f.elements.body.setCustomValidity('写下这一次的想法后再保存。');f.elements.body.reportValidity();return}const r=records.find(r=>r.id===f.elements.recordId.value);if(!r){notify('这条问答已不存在，请刷新页面。');return}const id=f.elements.answerId.value,date=f.elements.date.value;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){notify('请选择有效的解答日期。');return}
  const answers=id?r.answers.map(a=>a.id===id?{...a,body,date,updatedAt:new Date().toISOString()}:a):[...r.answers,{id:uid(),body,date,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}];if(updateRecord(r.id,{answers})){close('#answer-modal');showDetail(r.id,false);notify(id?'解答已更新':'解答已保存')}
});
$('#answer-body').addEventListener('input',ev=>ev.target.setCustomValidity(''));
$('#search').addEventListener('input',render);$('#sort').addEventListener('change',render);
function download(text,name){const url=URL.createObjectURL(new Blob([text],{type:'application/json;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('#export-btn').addEventListener('click',()=>{try{download(storageBroken?(localStorage.getItem(STORAGE_KEY)||'null'):backup(records),`问答手记-${storageBroken?'原始数据-':''}${today()}.json`);notify(storageBroken?'原始数据已导出，请妥善保留。':'备份已导出，记得妥善保存。')}catch{notify('无法读取浏览器存储，请检查浏览器设置。')}});
$('#import-btn').addEventListener('click',()=>$('#import-file').click());
$('#import-file').addEventListener('change',async ev=>{const file=ev.target.files[0];ev.target.value='';if(!file)return;if(file.size>20*1024*1024){notify('文件过大，请选择 20 MB 以内的 JSON 备份。');return}try{const imported=parseBackup(await file.text()),recovery=storageBroken;const existing=new Set(records.map(r=>r.id)),added=recovery?imported:imported.filter(r=>!existing.has(r.id));if(!added.length&&!recovery){notify('没有新的问答可导入，现有记录已保留。');return}confirm(recovery?'从备份恢复记录？':'导入这份备份？',recovery?`将用备份中的 ${imported.length} 条问答替换当前无法读取的数据。请确认已导出原始备份。`:`将新增 ${added.length} 条问答，跳过 ${imported.length-added.length} 条重复记录。你现有的问答和解答都会保留。`,()=>{if(persist(recovery?imported:[...added,...records],recovery)){view='all';filter='all';$('#search').value='';render();notify(`已导入 ${added.length} 条问答`)}},recovery,'确认导入')}catch(err){notify(err.message)}});
window.addEventListener('storage',ev=>{if(ev.key===STORAGE_KEY||ev.key===null){load();render();if($('#detail-modal').open&&activeId)showDetail(activeId,false);if($('#group-reader').open)showGroupReader(activeGroupName,false);notify('记录已与此浏览器的其他页面同步')}});
load();render();

})();
</script>
</body>
</html>
